name: 設計の自己検証

# **これが無かった間、124 個のテストは CI で一度も動いていなかった。**
# 手で pytest を叩いたときにしか動かず、「単体は通るが組み上げると食い込む」
# 状態を作った。基板の発注も 3D プリントも費用とリードタイムがかかるので、
# 押すたびに機械が確かめる状態にしておく。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: テスト（配列・キーマップ・プレート・ケース・基板・組み立て）
        run: pytest tools -q

  # **実形状の検査。**KiCad の 3D モデルから基板の実物を起こし、
  # 部品どうしが立体で当たらないかを厳密に見る（DRC は 2D で高さを見ない）。
  #
  # 重いので本体とは別のジョブにする。**ここが落ちても上の結果は隠れない。**
  # 手元では kicad-cli があれば同じものが走り、無ければ飛ぶ。
  #
  # **3D モデルの在り処は環境変数だけで解決する**（2026-08-10 に手元で確認）。
  # 基板ファイルは ${KICAD10_3DMODEL_DIR} と ${KICAD6_3RD_PARTY} を参照して
  # いるので、KiCad の版が違っても、この 2 つを指してやれば同じ結果になる。
  # **これをしないと、KiCad はモデルを警告なしに飛ばして立体数が減る**
  # （数を数える検査が落ちて気づける）。
  # **1 回 43 分かかる。**文書やファームだけを直した push で回す価値は無い
  # （2026-08-10。ファームの作業で 1 日に 20 回押した日、実行が詰まった）。
  # 形に関わるものが変わったときだけ回す。手で回すこともできる。
  # ⚠️ この一覧が**足りないと、変えたのに検査されない。**足すのを忘れないこと。
  changed:
    runs-on: ubuntu-latest
    outputs:
      shape: ${{ steps.f.outputs.shape }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "shape=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          if [ -z "$BASE" ]; then
            echo "shape=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
             | grep -qE '^(tools/|pcb/|layout/|\.github/workflows/checks\.yml)'; then
            echo "shape=true" >> "$GITHUB_OUTPUT"
          else
            echo "shape=false" >> "$GITHUB_OUTPUT"
          fi

  real-shape:
    needs: changed
    if: needs.changed.outputs.shape == 'true'
    runs-on: ubuntu-latest
    env:
      KICAD10_3DMODEL_DIR: /usr/share/kicad/3dmodels
      KICAD6_3RD_PARTY: /tmp/kicad-3rdparty
      KICAD_CLI: /usr/bin/kicad-cli
      # **飛んだ検査は無いのと同じ。**KiCad が入らなかったら緑にせず落とす
      REQUIRE_KICAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # **版を手元（KiCad 10）に合わせること。**9.0 を入れていた間、この
      # ジョブは一度も検査に到達していなかった。基板ファイルは
      # `(version 20260206)`＝KiCad 10 の書式で、9.0 の kicad-cli は
      # 読めずに終了コード 3 で落ちる（stderr は capture されて見えない）。
      # **赤の中身は「実形状の指摘」ではなく、環境の不一致だった。**
      - name: KiCad を入れる（**手元と同じ 10.0**）
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          # **kicad-packages3d も要る。**`--no-install-recommends` だと
          # 公式の 3D モデル（${KICAD10_3DMODEL_DIR}）が入らず、ダイオード
          # 61・74LVC595・コンデンサ・FFC コネクタが STEP に出ない。
          # kiswitch のソケットとスタビだけが残り、部品の数を数える検査が
          # 落ちて気づいた（2026-08-10）。**警告は出ない。**
          sudo apt-get install --yes --no-install-recommends \
            kicad kicad-packages3d
          kicad-cli --version
      - name: キースイッチの 3D モデルを入れる
        # 出所と選定理由は docs/hardware/decisions/2026-08-09-third-party-3d-models.md
        run: |
          git clone --depth 1 https://github.com/kiswitch/kiswitch.git /tmp/kiswitch
          D="$KICAD6_3RD_PARTY/3dmodels/com_github_perigoso_keyswitch-kicad-library/3d-library.3dshapes"
          mkdir -p "$D"
          cp /tmp/kiswitch/library/3dmodels/3d-library.3dshapes/SW_Hotswap_Kailh_MX.{wrl,stp} "$D/"
          cp /tmp/kiswitch/library/3dmodels/3d-library.3dshapes/Stabilizer_Cherry_MX_2.00u.{wrl,stp} "$D/"
          cp /tmp/kiswitch/library/3dmodels/3d-library.3dshapes/Stabilizer_Cherry_MX_3.00u.{wrl,stp} "$D/"
          # **フットプリントは参照していないが、検査が要る。**スイッチ本体は
          # 基板に載らない（載るのはホットスワップソケット）ので STEP には
          # 出てこない。`test_the_switch_boxes_match_the_real_switch` が
          # 「箱が実物と一致しているか」を測るのに使う。
          cp /tmp/kiswitch/library/3dmodels/3d-library.3dshapes/SW_Cherry_MX_Plate.stp "$D/"
      # **全部品を実形状にして、全組み合わせを許容ゼロで見る。**
      # 同じジョブに「わざと壊して落ちるか」の自己確認が入っている
      # （test_the_real_shape_check_actually_detects_a_collision）。
      # これが無いと、検査器が壊れていても緑になる。
      - name: 実形状の全組み合わせ（許容ゼロ）＋ 検査器の自己確認
        run: pytest tools/test_assembly.py -q -k "real or step_data"
