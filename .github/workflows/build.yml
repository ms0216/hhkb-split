name: Build ZMK firmware

# ZMK 公式の再利用ワークフローを呼ぶだけ。ローカルに Zephyr SDK は要らない。
#
# 配置は ZMK 標準（リポジトリ直下に config/ と build.yaml）にすること。
# 当初 firmware/config に入れ子にしたが、ワークフローは
#   west init -l <config_path>   → ワークスペースは config の親に作られる
#   west update                  → リポジトリ直下で実行される
# という前提なので、config の親がリポジトリ直下でないと
# "no west workspace found" で失敗する。

on:
  push:
    # **文書だけの push で 8 ターゲットを焼かない。**ファームの作業で 1 日に
    # 20 回押した日に実行が詰まった（checks.yml の real-shape と同じ理由）。
    # ⚠️ この一覧が**足りないと、変えたのにビルドされない。**
    # 一覧の外を直したあとで .uf2 が要るときは workflow_dispatch で回す
    # （Actions タブ → Build ZMK firmware → Run workflow）。
    paths:
      - "config/**"
      - "firmware/**"
      - "build.yaml"
      - "zephyr/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

# 呼び先はサードパーティの再利用ワークフロー。既定スコープのまま渡さない。
permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
