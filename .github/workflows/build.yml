name: Build ZMK firmware

# ZMK 公式の再利用ワークフローを呼ぶだけ。ローカルに Zephyr SDK は要らない。
#
# 配置は ZMK 標準（リポジトリ直下に config/ と build.yaml）にすること。
# 当初 firmware/config に入れ子にしたが、ワークフローは
#   west init -l <config_path>   → ワークスペースは config の親に作られる
#   west update                  → リポジトリ直下で実行される
# という前提なので、config の親がリポジトリ直下でないと
# "no west workspace found" で失敗する。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
