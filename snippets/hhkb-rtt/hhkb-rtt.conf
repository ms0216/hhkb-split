# RTT（SWD 経由でログを読む）。**調査用。常用のファームには入れない。**
#
# 使い方と配線は docs/development/rtt-debugging.md。

CONFIG_ZMK_RTT_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=32768

# --------------------------------------------------------------------------
# **BLE のアサートで落ちるのを防ぐ**（2026-10-15 に実機で 2 回踏んだ）
#
#     ASSERTION FAIL @ .../lll_peripheral.c
#         prepare_cb: Actual EVENT_OVERHEAD_START_US = 2105
#     >>> ZEPHYR FATAL ERROR 3: Kernel oops / Halting system
#
# `LL_ASSERT_OVERHEAD` は**無線イベントの準備が長引いた**ときに落ちる門。
# RTT の出力と SWD の読み出しが、まさにその時間を食う。
#
# 1) 出力そのものを減らす。dbg を**コンパイルごと落とす**。
#    実測: dbg あり 2105us → dbg なし 1220us（効いているが、まだ足りなかった）
CONFIG_LOG_MAX_LEVEL=3

# 2) 落ちる門そのものを切る。Zephyr の help:
#      「無効にすると、CPU の遅れで遅延した無線イベントを穏当に飛ばせる」
#    ⚠️ **連続して飛ばし続けると supervision timeout になる**（help の但し書き）。
#    だから常用しない。調査のあいだだけ。
#
# ⚠️⚠️ **`BT_CTLR_ADVANCED_FEATURES=y` が先に要る。**
# `BT_CTLR_ASSERT_OVERHEAD_START` は Kconfig.ll_sw_split の
#   menu "Advanced features"
#       visible if BT_CTLR_ADVANCED_FEATURES
# の**中**にあるので、これが無いと**代入が黙って無視される**
# （CI は "was assigned the value 'n' but got the value 'y'" と警告するだけ）。
#
# **この罠は過去に 1 度踏んでいる。**`BT_CTLR_PERIPHERAL_RESERVE_MAX` も
# 同じ menu の中で、同じように無視された（BLE のジッタ調査・
# 「ビルドが同一ハッシュで気づいた」）。**同じ型で 2 回目。**
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
