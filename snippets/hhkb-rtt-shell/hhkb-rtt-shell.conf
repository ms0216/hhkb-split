# RTT 越しの Zephyr shell。**調査用。常用しない。**
#
# 使い方:
#   probe-rs attach --chip nRF52840_xxAA --scan-region ram
#   → `rtt:~$ ` のプロンプトが出る。打てるコマンドの例:
#       kernel threads      … スレッドとスタックの使用量
#       kernel uptime
#       bt info             … BLE の状態
#       log_level set ...   … ログの level を**その場で**変える
#       device list         … デバイスの一覧と初期化の成否
#
# ⚠️ **CPU 時間を食う。**今日（2026-10-15）RTT のログだけでも
# BLE の `LL_ASSERT_OVERHEAD` に引っかかった。shell を足すとさらに重くなる。
# **入れたら安定性を測り直すこと**（docs/development/rtt-debugging.md）。
#
# ⚠️ **コマンドを打つには「人のターミナル」が要る。**
# `probe-rs attach` は対話端末（crossterm）を要求するので、
# **AI 側からは叩けない**（stdin のパイプは `Failed to create readline`、
# `script` の疑似端末では crossterm が panic する。2026-10-15 に確認）。
# **利用者が自分のターミナルで打つ。**
#
# 2026-10-15 の実機確認: `rtt:~$ ` のプロンプトが出るところまでは確認した。
# コマンドの実行結果は未確認。

# RTT のログ一式（hhkb-rtt と同じ。単体で使えるように重複して書く）
CONFIG_ZMK_RTT_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# **shell 版は dbg を「コンパイルでは残し、実行時に黙らせる」。**
# `-rtt-quiet` は LOG_MAX_LEVEL=3 で dbg をコンパイルごと落としているので、
# あとから上げられない。shell があるなら、
#   - 既定は静か（LOG_DEFAULT_LEVEL=3）＝ BLE を邪魔しない
#   - 見たいときだけ `kernel log_level zmk 4` で**その場で上げる**
# という使い方ができる。**焼き直さなくてよくなる。**
#
# ⚠️ 上げている間は重くなるので、BLE のアサート（LL_ASSERT_OVERHEAD）に
# 近づく。上の `BT_CTLR_ASSERT_OVERHEAD_START=n` と対で使うこと。
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_FILTERING=y

# shell 本体と RTT バックエンド
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y

# ⚠️⚠️ **shell と log を「別の RTT チャンネル」に分ける。**
#
# どちらも既定で**チャンネル 0** を使うので、そのままだとビルドが落ちる:
#   error: static assertion failed:
#          "Conflicting log RTT backend enabled on the same channel"
#   （subsys/shell/backends/shell_rtt.c:19 の BUILD_ASSERT）
#
# RTT の上り buffer は 3 本ある（`SEGGER_RTT_MAX_NUM_UP_BUFFERS` 既定 3）。
#   shell … 0（既定のまま。`probe-rs attach` が最初に見るのがここ）
#   log   … 1 へ逃がす
# ⚠️ `LOG_BACKEND_RTT_BUFFER_SIZE` は **index > 0 のときだけ効く**ので、
# 1 へ移したら大きさも自分で指定する（既定 1024 は小さい）。
#
# **一度 `SHELL_LOG_BACKEND=n` にして逃げようとしたが、それは誤り**
# （2026-10-15）。ログが shell 経由で出なくなるだけで、
# 「起動時の `<inf>` が出ない」症状はそのまま残る。チャンネルを分けるのが正しい。
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=16384
# **UART のバックエンドは切る。**既定で有効になり、存在しない UART を掴む。
CONFIG_SHELL_BACKEND_SERIAL=n

# （`SHELL_BACKEND_RTT` は `depends on !(SHELL_LOG_BACKEND && LOG_MODE_IMMEDIATE)`。
#   上で SHELL_LOG_BACKEND=n にしたので、この条件はもう問題にならない）

# 打てると嬉しいコマンド
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# ⚠️⚠️ **`CONFIG_BT_SHELL` は入れてはいけない。**
# 2026-10-15 に実機で `bt info` を打ったら**ファームが停止した**
# （RTT の出力が完全に止まり、リセットで復帰した。ハードは無事）。
#
# Zephyr の `bt` コマンド群は「**shell が BLE を初期化して所有する**」前提。
# ZMK は BLE を自前で管理しているので、同じスタックを両方が触って競合する。
# Kconfig に記号が在ることと、ZMK と共存できることは別。
#
# **BLE の状態は RTT のログで読める。**実際に読めている例:
#   `security_changed: ... level 2`      … 相手と繋がった
#   `split_peripheral_listener`          … 分割の接続
#   `Failed to start advertising (-120)` … 既に繋がっていて広告不要
# CONFIG_BT_SHELL=y   ← **入れない**
