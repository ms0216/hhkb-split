# RTT 越しの Zephyr shell。**調査用。常用しない。**
#
# 使い方:
#   probe-rs attach --chip nRF52840_xxAA --scan-region ram
#   → `rtt:~$ ` のプロンプトが出る。打てるコマンドの例:
#       kernel threads      … スレッドとスタックの使用量
#       kernel uptime
#       bt info             … BLE の状態
#       log_level set ...   … ログの level を**その場で**変える
#       device list         … デバイスの一覧と初期化の成否
#
# ⚠️ **CPU 時間を食う。**今日（2026-10-15）RTT のログだけでも
# BLE の `LL_ASSERT_OVERHEAD` に引っかかった。shell を足すとさらに重くなる。
# **入れたら安定性を測り直すこと**（docs/development/rtt-debugging.md）。

# RTT のログ一式（hhkb-rtt と同じ。単体で使えるように重複して書く）
CONFIG_ZMK_RTT_LOGGING=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_LOG_MAX_LEVEL=3
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# shell 本体と RTT バックエンド
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
# **UART のバックエンドは切る。**既定で有効になり、存在しない UART を掴む。
CONFIG_SHELL_BACKEND_SERIAL=n

# ⚠️ `SHELL_BACKEND_RTT` は `depends on !(SHELL_LOG_BACKEND && LOG_MODE_IMMEDIATE)`。
# **LOG_MODE_IMMEDIATE を有効にしてはいけない**（RTT の shell が無効になる）。

# 打てると嬉しいコマンド
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_BT_SHELL=y
