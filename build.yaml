# ビルド対象（ボード × シールド）の一覧。
#
# ボード名は ZMK バリアント付きで指定する。ZMK が Zephyr 4.1 へ移行した際、
# ZMK ツリーのボード定義はすべて zmk バリアント経由で使う決まりになった。
#   旧: seeeduino_xiao_ble  →  新: xiao_ble//zmk
# 参照: https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
include:
  - board: xiao_ble//zmk
    shield: proto_direct        # 疎通確認用（XIAO 1個・キー2個）
  - board: xiao_ble//zmk
    shield: proto_matrix        # Task C2-a 用（XIAO 1個・2行×2列マトリクスとゴースト試験）
  - board: xiao_ble//zmk
    shield: proto_shift         # Task C2-b 用（同じ行列を 74HC595 で駆動）
  - board: xiao_ble//zmk
    shield: proto_split_left    # Task C3 用（BLE 分割だけを切り出した治具・左）
  - board: xiao_ble//zmk
    shield: proto_split_right   # Task C3 用（同・右）
  # **ボンド（BLE の結合情報）を消すための救済用。**
  # 「リストには出るのに接続できない」の最も多い原因は、ホストと装置の
  # どちらか片方だけが相手を覚えている状態。装置側から消すには
  # `&bt BT_CLR` を割り当てたキーが要るが、C4 の治具にはキーが無い。
  # これを焼くと設定領域ごと消えるので、キー無しで復旧できる。
  # **消したあとは本来のファームを焼き直すこと。**
  - board: xiao_ble//zmk
    shield: settings_reset

  # **測定専用**（Task C4・open-gaps #44）。BLE 送信バーストの高さと長さ。
  # LED を明示的に消し、分割・キー・ADC・ログを全部外してある。
  # **本番の設定ではない。**
  - board: xiao_ble//zmk
    shield: c4_txburst

  - board: xiao_ble//zmk
    shield: hhkb_split_left
  - board: xiao_ble//zmk
    shield: hhkb_split_right
