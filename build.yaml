# ビルド対象（ボード × シールド）の一覧。
#
# ボード名は ZMK バリアント付きで指定する。ZMK が Zephyr 4.1 へ移行した際、
# ZMK ツリーのボード定義はすべて zmk バリアント経由で使う決まりになった。
#   旧: seeeduino_xiao_ble  →  新: xiao_ble//zmk
# 参照: https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
include:
  - board: xiao_ble//zmk
    shield: proto_direct        # 疎通確認用（XIAO 1個・キー2個）
  - board: xiao_ble//zmk
    shield: proto_matrix        # Task C2-a 用（XIAO 1個・2行×2列マトリクスとゴースト試験）
  - board: xiao_ble//zmk
    shield: proto_shift         # Task C2-b 用（同じ行列を 74HC595 で駆動）
  - board: xiao_ble//zmk
    shield: proto_split_left    # Task C3 用（BLE 分割だけを切り出した治具・左）
  - board: xiao_ble//zmk
    shield: proto_split_right   # Task C3 用（同・右）
  - board: xiao_ble//zmk
    shield: hhkb_split_left
  - board: xiao_ble//zmk
    shield: hhkb_split_right
