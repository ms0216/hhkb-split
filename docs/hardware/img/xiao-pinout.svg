<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">XIAO nRF52840 — 上から見た図（USB が奥）</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#666">赤いピンが Task C2 で使う 6 本。左列と右列にまたがるので、ヘッダは両側とも必要</text>

  <!-- USB connector -->
  <rect x="288" y="62" width="64" height="20" rx="3" fill="#b8bcc2" stroke="#8a8f96" stroke-width="1.5"/>
  <text x="320" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#3c4147">USB-C</text>

  <!-- board -->
  <rect x="250" y="82" width="140" height="200" rx="6" fill="#1f2933" stroke="#0d1216" stroke-width="2"/>
  <!-- RF shield -->
  <rect x="272" y="140" width="96" height="86" rx="4" fill="#2e3a45"/>
  <text x="320" y="176" text-anchor="middle" font-size="10" fill="#c9d3dc">seeed studio</text>
  <text x="320" y="192" text-anchor="middle" font-size="8" fill="#8b97a3">XIAO-nRF52840</text>
  <text x="320" y="206" text-anchor="middle" font-size="8" fill="#8b97a3">211-220207</text>
  <!-- reset button -->
  <circle cx="264" cy="98" r="6" fill="#5b6670"/>
  <text x="264" y="118" text-anchor="middle" font-size="7" fill="#9aa5b0">RST</text>

  <!-- ================= LEFT PADS ================= -->
  <!-- y: 110 135 160 185 210 235 260 -->
  <g>
    <!-- D0 -->
    <rect x="242" y="104" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="232" y="114" text-anchor="end" font-size="14" fill="#9aa0a6">D0</text>
    <text x="196" y="114" text-anchor="end" font-size="11" fill="#b8bec4">1</text>
    <!-- D1 -->
    <rect x="242" y="129" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="232" y="139" text-anchor="end" font-size="14" fill="#9aa0a6">D1</text>
    <text x="196" y="139" text-anchor="end" font-size="11" fill="#b8bec4">2</text>
    <!-- D2 -->
    <rect x="242" y="154" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="232" y="164" text-anchor="end" font-size="14" fill="#9aa0a6">D2</text>
    <text x="196" y="164" text-anchor="end" font-size="11" fill="#b8bec4">3</text>
    <!-- D3 * -->
    <rect x="242" y="179" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="232" y="189" text-anchor="end" font-size="14" font-weight="bold" fill="#d64545">D3</text>
    <text x="196" y="189" text-anchor="end" font-size="11" font-weight="bold" fill="#d64545">4</text>
    <!-- D4 * -->
    <rect x="242" y="204" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="232" y="214" text-anchor="end" font-size="14" font-weight="bold" fill="#d64545">D4</text>
    <text x="196" y="214" text-anchor="end" font-size="11" font-weight="bold" fill="#d64545">5</text>
    <!-- D5 * -->
    <rect x="242" y="229" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="232" y="239" text-anchor="end" font-size="14" font-weight="bold" fill="#d64545">D5</text>
    <text x="196" y="239" text-anchor="end" font-size="11" font-weight="bold" fill="#d64545">6</text>
    <!-- D6 * -->
    <rect x="242" y="254" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="232" y="264" text-anchor="end" font-size="14" font-weight="bold" fill="#d64545">D6</text>
    <text x="196" y="264" text-anchor="end" font-size="11" font-weight="bold" fill="#d64545">7</text>
  </g>

  <!-- ================= RIGHT PADS ================= -->
  <g>
    <!-- 5V -->
    <rect x="381" y="104" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="408" y="114" font-size="14" fill="#9aa0a6">5V</text>
    <text x="444" y="114" font-size="11" fill="#b8bec4">1</text>
    <!-- GND -->
    <rect x="381" y="129" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="408" y="139" font-size="14" fill="#9aa0a6">GND</text>
    <text x="444" y="139" font-size="11" fill="#b8bec4">2</text>
    <!-- 3V3 -->
    <rect x="381" y="154" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="408" y="164" font-size="14" fill="#9aa0a6">3V3</text>
    <text x="444" y="164" font-size="11" fill="#b8bec4">3</text>
    <!-- D10 -->
    <rect x="381" y="179" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="408" y="189" font-size="14" fill="#9aa0a6">D10</text>
    <text x="444" y="189" font-size="11" fill="#b8bec4">4</text>
    <!-- D9 -->
    <rect x="381" y="204" width="17" height="12" rx="2" fill="#c9a227"/>
    <text x="408" y="214" font-size="14" fill="#9aa0a6">D9</text>
    <text x="444" y="214" font-size="11" fill="#b8bec4">5</text>
    <!-- D8 * -->
    <rect x="381" y="229" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="408" y="239" font-size="14" font-weight="bold" fill="#d64545">D8</text>
    <text x="444" y="239" font-size="11" font-weight="bold" fill="#d64545">6</text>
    <!-- D7 * -->
    <rect x="381" y="254" width="17" height="12" rx="2" fill="#d64545"/>
    <text x="408" y="264" font-size="14" font-weight="bold" fill="#d64545">D7</text>
    <text x="444" y="264" font-size="11" font-weight="bold" fill="#d64545">7</text>
  </g>

  <!-- callouts -->
  <rect x="40" y="176" width="132" height="96" rx="5" fill="#fdf1f1" stroke="#d64545" stroke-width="1.2"/>
  <text x="106" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#d64545">左列</text>
  <text x="106" y="216" text-anchor="middle" font-size="12" fill="#5a2020">上から 4・5・6・7 番目</text>
  <text x="106" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a2020">D3 D4 D5 D6</text>
  <text x="106" y="262" text-anchor="middle" font-size="11" fill="#8a5555">＝ 一番下から 4 本</text>

  <rect x="468" y="216" width="132" height="76" rx="5" fill="#fdf1f1" stroke="#d64545" stroke-width="1.2"/>
  <text x="534" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#d64545">右列</text>
  <text x="534" y="256" text-anchor="middle" font-size="12" fill="#5a2020">一番下と、その 1 つ上</text>
  <text x="534" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a2020">D7（最下） D8</text>

  <!-- warning strip -->
  <rect x="40" y="304" width="560" height="40" rx="5" fill="#fff8e6" stroke="#c9a227" stroke-width="1.2"/>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#6b5410">ピン番号のシルクは基板の「裏面」にしかない。ブレッドボードに挿すと見えなくなるので、</text>
  <text x="320" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">USB を奥に向けた向きと、上から何番目か で数えること。</text>
</svg>
