<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="400" fill="#ffffff"/>

  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">XIAO nRF52840 のピン割り当て（本番）— 上から見た図、USB が奥</text>
  <text x="350" y="48" text-anchor="middle" font-size="12" fill="#666">使える GPIO は D0〜D10 の 11 本。左右の半分とも同じ割り当て</text>

  <!-- USB -->
  <rect x="318" y="62" width="64" height="20" rx="3" fill="#b8bcc2" stroke="#8a8f96" stroke-width="1.5"/>
  <text x="350" y="77" text-anchor="middle" font-size="10" font-weight="bold" fill="#3c4147">USB-C</text>

  <!-- board -->
  <rect x="280" y="82" width="140" height="200" rx="6" fill="#1f2933" stroke="#0d1216" stroke-width="2"/>
  <rect x="302" y="140" width="96" height="86" rx="4" fill="#2e3a45"/>
  <text x="350" y="176" text-anchor="middle" font-size="10" fill="#c9d3dc">seeed studio</text>
  <text x="350" y="192" text-anchor="middle" font-size="8" fill="#8b97a3">XIAO-nRF52840</text>
  <text x="350" y="206" text-anchor="middle" font-size="8" fill="#8b97a3">211-220207</text>
  <circle cx="294" cy="98" r="6" fill="#5b6670"/>

  <!-- LEFT pads: D0..D6 at y=110..260 step 25 -->
  <g>
    <rect x="272" y="104" width="17" height="12" rx="2" fill="#7b5ea7"/>
    <text x="262" y="114" text-anchor="end" font-size="13" font-weight="bold" fill="#5f4585">D0</text>
    <text x="214" y="114" text-anchor="end" font-size="11" fill="#7b5ea7">電池電圧 ADC</text>

    <rect x="272" y="129" width="17" height="12" rx="2" fill="#2f8f4e"/>
    <text x="262" y="139" text-anchor="end" font-size="13" font-weight="bold" fill="#1e6b39">D1</text>
    <rect x="272" y="154" width="17" height="12" rx="2" fill="#2f8f4e"/>
    <text x="262" y="164" text-anchor="end" font-size="13" font-weight="bold" fill="#1e6b39">D2</text>
    <rect x="272" y="179" width="17" height="12" rx="2" fill="#2f8f4e"/>
    <text x="262" y="189" text-anchor="end" font-size="13" font-weight="bold" fill="#1e6b39">D3</text>
    <rect x="272" y="204" width="17" height="12" rx="2" fill="#2f8f4e"/>
    <text x="262" y="214" text-anchor="end" font-size="13" font-weight="bold" fill="#1e6b39">D4</text>
    <rect x="272" y="229" width="17" height="12" rx="2" fill="#2f8f4e"/>
    <text x="262" y="239" text-anchor="end" font-size="13" font-weight="bold" fill="#1e6b39">D5</text>
    <path d="M 214 133 L 206 133 L 206 239 L 214 239" fill="none" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="198" y="182" text-anchor="end" font-size="12" font-weight="bold" fill="#1e6b39">行 5 本</text>
    <text x="198" y="198" text-anchor="end" font-size="10" fill="#4a8060">MCU 直結の入力</text>

    <rect x="272" y="254" width="17" height="12" rx="2" fill="#9aa0a6"/>
    <text x="262" y="264" text-anchor="end" font-size="13" fill="#7d838a">D6</text>
    <text x="214" y="264" text-anchor="end" font-size="11" fill="#9aa0a6">予備</text>
  </g>

  <!-- RIGHT pads -->
  <g>
    <rect x="411" y="104" width="17" height="12" rx="2" fill="#9aa0a6"/>
    <text x="438" y="114" font-size="13" fill="#7d838a">5V</text>
    <rect x="411" y="129" width="17" height="12" rx="2" fill="#9aa0a6"/>
    <text x="438" y="139" font-size="13" fill="#7d838a">GND</text>
    <rect x="411" y="154" width="17" height="12" rx="2" fill="#c94f4f"/>
    <text x="438" y="164" font-size="13" font-weight="bold" fill="#a83232">3V3</text>
    <text x="482" y="164" font-size="11" fill="#a83232">乾電池からの給電先</text>

    <rect x="411" y="179" width="17" height="12" rx="2" fill="#3a63c4"/>
    <text x="438" y="189" font-size="13" font-weight="bold" fill="#2b4a97">D10</text>
    <text x="482" y="189" font-size="11" fill="#3a63c4">SPI MOSI</text>
    <rect x="411" y="204" width="17" height="12" rx="2" fill="#8b9dc9"/>
    <text x="438" y="214" font-size="13" fill="#6b7fa8">D9</text>
    <text x="482" y="214" font-size="11" fill="#8b9dc9">SPI MISO（未使用）</text>
    <rect x="411" y="229" width="17" height="12" rx="2" fill="#3a63c4"/>
    <text x="438" y="239" font-size="13" font-weight="bold" fill="#2b4a97">D8</text>
    <text x="482" y="239" font-size="11" fill="#3a63c4">SPI SCK</text>
    <rect x="411" y="254" width="17" height="12" rx="2" fill="#3a63c4"/>
    <text x="438" y="264" font-size="13" font-weight="bold" fill="#2b4a97">D7</text>
    <text x="482" y="264" font-size="11" fill="#3a63c4">74HC595 の CS</text>
  </g>

  <!-- notes -->
  <rect x="40" y="298" width="620" height="42" rx="5" fill="#eef7f0" stroke="#2f8f4e" stroke-width="1.2"/>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#1e6b39">列（出力）は 74HC595 で作る。行（入力）を MCU 直結のままにしてあるのは ZMK 公式の指示で、</text>
  <text x="350" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b39">入力が MCU のピンなら割り込みで起こせる ＝ 常時スキャンせずに済み、電池が持つため。</text>

  <rect x="40" y="348" width="620" height="38" rx="5" fill="#fff8e6" stroke="#c9a227" stroke-width="1.2"/>
  <text x="350" y="365" text-anchor="middle" font-size="12" fill="#6b5410">ピン番号のシルクは基板の「裏面」にしかない。ブレッドボードに挿すと見えなくなるので、</text>
  <text x="350" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">USB を奥に向けた向きと、上から何番目か で数えること（左列 D0〜D6 / 右列 5V GND 3V3 D10 D9 D8 D7）。</text>
</svg>
