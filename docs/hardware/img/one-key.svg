<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="660" height="470" fill="#ffffff"/>

  <!-- ============ 1. tact switch legs ============ -->
  <text x="24" y="30" font-size="16" font-weight="bold" fill="#111">① タクトスイッチのどの足を使うか</text>
  <text x="24" y="50" font-size="12" fill="#666">同じ辺に並ぶ 2 本は内部で最初からつながっている。押していなくても常時導通するので使えない。</text>

  <!-- switch body -->
  <rect x="150" y="76" width="96" height="96" rx="5" fill="#2f3944" stroke="#141a20" stroke-width="2"/>
  <circle cx="198" cy="124" r="20" fill="#4a5661" stroke="#141a20" stroke-width="1.5"/>
  <text x="198" y="128" text-anchor="middle" font-size="9" fill="#c9d3dc">押しボタン</text>

  <!-- legs: left pair -->
  <line x1="150" y1="96" x2="104" y2="96" stroke="#b8a04a" stroke-width="5"/>
  <line x1="150" y1="152" x2="104" y2="152" stroke="#b8a04a" stroke-width="5"/>
  <!-- legs: right pair -->
  <line x1="246" y1="96" x2="292" y2="96" stroke="#b8a04a" stroke-width="5"/>
  <line x1="246" y1="152" x2="292" y2="152" stroke="#b8a04a" stroke-width="5"/>

  <!-- internal shorts -->
  <path d="M 132 96 L 132 152" stroke="#2f8f4e" stroke-width="3" stroke-dasharray="5,4" fill="none"/>
  <path d="M 264 96 L 264 152" stroke="#2f8f4e" stroke-width="3" stroke-dasharray="5,4" fill="none"/>
  <text x="132" y="180" text-anchor="middle" font-size="10" fill="#2f8f4e">常時導通</text>
  <text x="264" y="180" text-anchor="middle" font-size="10" fill="#2f8f4e">常時導通</text>

  <!-- good / bad -->
  <circle cx="104" cy="96" r="9" fill="none" stroke="#d64545" stroke-width="3"/>
  <circle cx="292" cy="152" r="9" fill="none" stroke="#d64545" stroke-width="3"/>
  <path d="M 104 96 L 292 152" stroke="#d64545" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="330" y="76" width="306" height="46" rx="5" fill="#eef7f0" stroke="#2f8f4e" stroke-width="1.2"/>
  <text x="344" y="97" font-size="13" font-weight="bold" fill="#1e6b39">◯ 使う 2 本 ＝ 対角（左上と右下）</text>
  <text x="344" y="114" font-size="11" fill="#3c6b4c">向かい合う辺から 1 本ずつ選ぶ</text>

  <rect x="330" y="130" width="306" height="46" rx="5" fill="#fdf1f1" stroke="#d64545" stroke-width="1.2"/>
  <text x="344" y="151" font-size="13" font-weight="bold" fill="#a83232">✕ 同じ辺の 2 本</text>
  <text x="344" y="168" font-size="11" fill="#8a4444">押さなくても常時オン。検証にならない</text>

  <text x="24" y="204" font-size="11" fill="#666">テスターの導通モードで「押したときだけ鳴る」組み合わせを確かめてから挿すのが確実。</text>

  <!-- ============ 2. one key circuit ============ -->
  <line x1="24" y1="228" x2="636" y2="228" stroke="#dde1e5" stroke-width="1.5"/>
  <text x="24" y="258" font-size="16" font-weight="bold" fill="#111">② 1 キーぶんの配線</text>
  <text x="24" y="278" font-size="12" fill="#666">スイッチとダイオードを直列にして、2 本のピンの間に入れる。ダイオードの向きが結果そのもの。</text>

  <!-- left pin -->
  <rect x="40" y="318" width="86" height="38" rx="5" fill="#fdf1f1" stroke="#d64545" stroke-width="1.6"/>
  <text x="83" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#a83232">列 (D6)</text>
  <text x="83" y="350" text-anchor="middle" font-size="10" fill="#8a4444">アノード側・出力</text>

  <!-- wire -->
  <line x1="126" y1="337" x2="196" y2="337" stroke="#333" stroke-width="2.5"/>

  <!-- switch symbol -->
  <circle cx="200" cy="337" r="4" fill="#333"/>
  <line x1="200" y1="337" x2="252" y2="314" stroke="#333" stroke-width="2.5"/>
  <circle cx="256" cy="337" r="4" fill="#333"/>
  <text x="228" y="374" text-anchor="middle" font-size="12" fill="#333">タクトスイッチ</text>

  <line x1="256" y1="337" x2="352" y2="337" stroke="#333" stroke-width="2.5"/>

  <!-- diode symbol: triangle points right, bar on right = cathode -->
  <polygon points="352,323 352,351 382,337" fill="#333"/>
  <line x1="382" y1="320" x2="382" y2="354" stroke="#333" stroke-width="5"/>
  <line x1="382" y1="337" x2="470" y2="337" stroke="#333" stroke-width="2.5"/>
  <text x="367" y="374" text-anchor="middle" font-size="12" fill="#333">1N4007</text>
  <text x="382" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#d64545">帯はこちら側</text>

  <!-- right pin -->
  <rect x="470" y="318" width="86" height="38" rx="5" fill="#eef3fd" stroke="#3a63c4" stroke-width="1.6"/>
  <text x="513" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a97">行 (D1)</text>
  <text x="513" y="350" text-anchor="middle" font-size="10" fill="#4a63a0">カソード側・入力</text>

  <!-- current arrow -->
  <line x1="83" y1="398" x2="505" y2="398" stroke="#2f8f4e" stroke-width="2"/>
  <polygon points="513,398 501,393 501,403" fill="#2f8f4e"/>
  <text x="296" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f8f4e">電流が流れる向き</text>

  <!-- real diode -->
  <rect x="40" y="418" width="596" height="40" rx="5" fill="#fff8e6" stroke="#c9a227" stroke-width="1.2"/>
  <rect x="240" y="428" width="60" height="20" rx="3" fill="#3a3a3a"/>
  <rect x="288" y="428" width="7" height="20" fill="#e8e8e8"/>
  <line x1="214" y1="438" x2="240" y2="438" stroke="#999" stroke-width="3"/>
  <line x1="300" y1="438" x2="326" y2="438" stroke="#999" stroke-width="3"/>
  <text x="200" y="442" text-anchor="end" font-size="12" fill="#6b5410">実物 →</text>
  <text x="346" y="435" font-size="12" font-weight="bold" fill="#6b5410">白い帯のある側がカソード。</text>
  <text x="346" y="451" font-size="12" fill="#6b5410">逆に挿すとそのキーは反応しない。</text>
</svg>
