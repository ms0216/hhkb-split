<rect x="377.1" y="198" width="296.1" height="46" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
<text x="525.2" y="225.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.345</text>
<rect x="673.3" y="198" width="5.0" height="46" fill="#2b4a97" stroke="#ffffff" stroke-width="1"/>
<rect x="678.3" y="198" width="0.6" height="46" fill="#d35400" stroke="#ffffff" stroke-width="1"/>
<text x="24" y="219.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">候補 A</text>
<text x="24" y="236.0" text-anchor="start" font-size="10.5" fill="#777">分割 7.5ms ／ ホスト 15ms・latency 30</text>
<text x="690.2801843317974" y="218.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.441 mA</text>
<text x="690.2801843317974" y="235.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1e8449">6.2 ヶ月</text>
<circle cx="668.6" cy="191" r="5" fill="#111"/>
<text x="658.5714285714287" y="195" text-anchor="end" font-size="10.5" font-weight="bold" fill="#111">実測 0.43</text>
<text x="300" y="259" text-anchor="start" font-size="10" fill="#777">遅延も左右差も動かない。Mac・Windows とも同じ値</text>
<rect x="300.0" y="278" width="25.7" height="46" fill="#9aa1a8" stroke="#ffffff" stroke-width="1"/>
<rect x="325.7" y="278" width="51.4" height="46" fill="#6c3483" stroke="#ffffff" stroke-width="1"/>
<text x="351.42857142857144" y="305.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.060</text>
<rect x="377.1" y="278" width="148.1" height="46" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
<text x="451.1714285714286" y="305.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.173</text>
<rect x="525.2" y="278" width="5.0" height="46" fill="#2b4a97" stroke="#ffffff" stroke-width="1"/>
<rect x="530.2" y="278" width="0.6" height="46" fill="#d35400" stroke="#ffffff" stroke-width="1"/>
<text x="24" y="299.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">候補 A ＋ 分割 15ms</text>
<text x="24" y="316.0" text-anchor="start" font-size="10.5" fill="#777">分割 15ms ／ ホスト 15ms・latency 30</text>
<text x="542.2230414746545" y="298.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.269 mA</text>
<text x="542.2230414746545" y="315.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1e8449">10.2 ヶ月</text>
<circle cx="531.4" cy="271" r="5" fill="#111"/>
<text x="521.4285714285714" y="275" text-anchor="end" font-size="10.5" font-weight="bold" fill="#111">実測 0.27</text>
<text x="300" y="339" text-anchor="start" font-size="10" fill="#777">右手だけ平均 +3.75ms。打鍵の違和感は無かった（目隠しではない）</text>
<rect x="300.0" y="358" width="25.7" height="46" fill="#9aa1a8" stroke="#ffffff" stroke-width="1"/>
<rect x="325.7" y="358" width="51.4" height="46" fill="#6c3483" stroke="#ffffff" stroke-width="1"/>
<text x="351.42857142857144" y="385.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.060</text>
<rect x="377.1" y="358" width="74.0" height="46" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
<text x="414.1571428571429" y="385.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.086</text>
<rect x="451.2" y="358" width="5.0" height="46" fill="#2b4a97" stroke="#ffffff" stroke-width="1"/>
<rect x="456.2" y="358" width="0.6" height="46" fill="#d35400" stroke="#ffffff" stroke-width="1"/>
<text x="24" y="379.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">候補 A ＋ 分割 30ms</text>
<text x="24" y="396.0" text-anchor="start" font-size="10.5" fill="#777">分割 30ms ／ ホスト 15ms・latency 30</text>
<text x="468.19447004608304" y="378.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.182 mA</text>
<text x="468.19447004608304" y="395.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1e8449">15.0 ヶ月</text>
<circle cx="454.3" cy="351" r="5" fill="#111"/>
<text x="444.28571428571433" y="355" text-anchor="end" font-size="10.5" font-weight="bold" fill="#111">実測 0.18</text>
<text x="300" y="419" text-anchor="start" font-size="10" fill="#777">右手だけ平均 +7.5ms。実測は 0.14〜0.21 で振れた</text>
<rect x="300.0" y="438" width="25.7" height="46" fill="#9aa1a8" stroke="#ffffff" stroke-width="1"/>
<rect x="325.7" y="438" width="51.4" height="46" fill="#6c3483" stroke="#ffffff" stroke-width="1"/>
<text x="351.42857142857144" y="465.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.060</text>
<rect x="377.1" y="438" width="296.1" height="46" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
<text x="525.2" y="465.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.345</text>
<rect x="673.3" y="438" width="5.0" height="46" fill="#2b4a97" stroke="#ffffff" stroke-width="1"/>
<rect x="678.3" y="438" width="85.5" height="46" fill="#d35400" stroke="#ffffff" stroke-width="1"/>
<text x="721.0156682027651" y="465.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0.100</text>
<text x="24" y="459.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">候補 A ＋ TX +8dBm</text>
<text x="24" y="476.0" text-anchor="start" font-size="10.5" fill="#777">分割 7.5ms ／ ホスト 15ms・latency 30／ TX +8dBm</text>
<text x="775.7511520737329" y="458.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.541 mA</text>
<text x="775.7511520737329" y="475.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1e8449">5.1 ヶ月</text>
<circle cx="762.9" cy="431" r="5" fill="#111"/>
<text x="752.8571428571429" y="435" text-anchor="end" font-size="10.5" font-weight="bold" fill="#111">実測 0.54</text>
<text x="300" y="499" text-anchor="start" font-size="10" fill="#777">電波の余裕を買う。寿命を 1.1 ヶ月払う</text>
<rect x="300" y="536" width="13" height="13" fill="#9aa1a8"/>
<text x="318" y="547" text-anchor="start" font-size="10" fill="#555">CPU・DC/DC・分圧</text>
<rect x="450" y="536" width="13" height="13" fill="#6c3483"/>
<text x="468" y="547" text-anchor="start" font-size="10" fill="#555">BLE スタック</text>
<rect x="600" y="536" width="13" height="13" fill="#c0392b"/>
<text x="618" y="547" text-anchor="start" font-size="10" fill="#555">分割リンク（左 ↔ 右）</text>
<rect x="750" y="536" width="13" height="13" fill="#2b4a97"/>
<text x="768" y="547" text-anchor="start" font-size="10" fill="#555">ホストリンク（左 ↔ PC）</text>
<rect x="900" y="536" width="13" height="13" fill="#d35400"/>
<text x="918" y="547" text-anchor="start" font-size="10" fill="#555">TX +8dBm の上乗せ</text>
<text x="24" y="547" text-anchor="start" font-size="10.5" font-weight="bold" fill="#111">● ＝ 実測値</text>
<text x="24" y="582" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">② 使っている式と、その根拠</text>
<rect x="24" y="594" width="1192" height="132" rx="8" fill="#f7f9fb" stroke="#d5dae0"/>
<text x="44" y="622" text-anchor="start" font-size="13" font-weight="bold" fill="#111">I  =  床 0.090  +  2.591 ÷ 分割間隔[ms]  +  2.725 ÷ ( ホスト間隔[ms] × (latency+1) )   [ +8dBm なら さらに 0.736 ÷ 同じ 2 つ ]</text>
<text x="44" y="648" text-anchor="start" font-size="11" fill="#555">前提: 無線イベント 1 回あたりの費用は、相手が右手でもホストでも同じ。→ 2 つの係数が近い値（2.591 と 2.725）になったことが傍証。</text>
<text x="44" y="670" text-anchor="start" font-size="11" fill="#555">latency は「送るものが無いとき、何回まで聞き逃してよいか」。送るものがあれば次の機会に送るので、打鍵の遅延は増えない。</text>
<text x="44" y="692" text-anchor="start" font-size="11" fill="#1e8449">検算: 0.617/0.63・0.441/0.43・0.269/0.27・0.182/0.18・0.541/0.54。5 点すべてで残差 0.01mA 以内。予測してから測って当てた点が 3 つある。</text>
<text x="44" y="712" text-anchor="start" font-size="11" fill="#d35400">⚠️ 本番はこれに 74LVC595 の静止電流 0.02mA（データシート・右は 2 個）が乗る。</text>
<text x="24" y="758" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">③ どのレバーが、どれだけ効くか</text>
<text x="24" y="784" text-anchor="start" font-size="11" font-weight="bold" fill="#555">変えるもの</text>
<text x="400" y="784" text-anchor="start" font-size="11" font-weight="bold" fill="#555">電流の変化</text>
<text x="520" y="784" text-anchor="start" font-size="11" font-weight="bold" fill="#555">寿命の変化</text>
<text x="650" y="784" text-anchor="start" font-size="11" font-weight="bold" fill="#555">払う代償</text>
<text x="890" y="784" text-anchor="start" font-size="11" font-weight="bold" fill="#555">何で確かめたか</text>
<line x1="24" y1="790" x2="1216" y2="790" stroke="#ccd2d8"/>
<text x="24" y="812" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">分割リンクを 7.5 → 30ms</text>
<text x="400" y="812" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">−0.259mA</text>
<text x="520" y="812" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">＋8.8 ヶ月</text>
<text x="650" y="812" text-anchor="start" font-size="11" fill="#555">右手だけ平均 +7.5ms。左右差</text>
<text x="890" y="812" text-anchor="start" font-size="10.5" fill="#777">実測 0.18mA（0.14〜0.21 で振れる）</text>
<text x="24" y="842" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">分割リンクを 7.5 → 15ms</text>
<text x="400" y="842" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">−0.173mA</text>
<text x="520" y="842" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">＋4.0 ヶ月</text>
<text x="650" y="842" text-anchor="start" font-size="11" fill="#555">右手だけ平均 +3.75ms。左右差</text>
<text x="890" y="842" text-anchor="start" font-size="10.5" fill="#777">実測 0.27mA。打鍵の違和感は無し（目隠しでない）</text>
<text x="24" y="872" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">ホストの latency を 0 → 30</text>
<text x="400" y="872" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">−0.176mA</text>
<text x="520" y="872" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">＋1.8 ヶ月</text>
<text x="650" y="872" text-anchor="start" font-size="11" fill="#555">なし</text>
<text x="890" y="872" text-anchor="start" font-size="10.5" fill="#777">実測（Mac・Windows とも 0.43）＋ログで受理を確認</text>
<text x="24" y="902" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">送信電力を 0 → +8dBm</text>
<text x="400" y="902" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">＋0.100mA</text>
<text x="520" y="902" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">−1.1 ヶ月</text>
<text x="650" y="902" text-anchor="start" font-size="11" fill="#555">電波の余裕を買う（左だけ強くなる）</text>
<text x="890" y="902" text-anchor="start" font-size="10.5" fill="#777">実測 0.54mA。ZMK の「無視できる」は当てはまらない</text>
<text x="24" y="932" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">送信電力を 0 → −20dBm</text>
<text x="400" y="932" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">−0.01mA</text>
<text x="520" y="932" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">＋0.15 ヶ月</text>
<text x="650" y="932" text-anchor="start" font-size="11" fill="#555">届く距離を捨てる</text>
<text x="890" y="932" text-anchor="start" font-size="10.5" fill="#777">実測 0.43mA。電力 1/100 でも 1〜1.5m で打鍵できた</text>
<text x="24" y="962" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">2M PHY をやめて 1M にする</text>
<text x="400" y="962" text-anchor="start" font-size="11.5" font-weight="bold" fill="#d35400">＋0.05mA</text>
<text x="520" y="962" text-anchor="start" font-size="11.5" font-weight="bold" fill="#d35400">−0.7 ヶ月</text>
<text x="650" y="962" text-anchor="start" font-size="11" fill="#555">感度が 3dB 良くなる（届きやすくなる）</text>
<text x="890" y="962" text-anchor="start" font-size="10.5" fill="#777">実測 0.49mA。2M は既定で効いていた</text>
<text x="24" y="992" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">ホストの間隔 15 → 60ms（latency 30 のまま）</text>
<text x="400" y="992" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">−0.004mA</text>
<text x="520" y="992" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">＋0.1 ヶ月</text>
<text x="650" y="992" text-anchor="start" font-size="11" fill="#555">両手に +22ms</text>
<text x="890" y="992" text-anchor="start" font-size="10.5" fill="#777">式。分解能以下なので実測で確かめられない</text>
<text x="24" y="1022" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">マトリクス走査・595 の駆動をやめる</text>
<text x="400" y="1022" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">0.00mA</text>
<text x="520" y="1022" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">±0</text>
<text x="650" y="1022" text-anchor="start" font-size="11" fill="#555">—</text>
<text x="890" y="1022" text-anchor="start" font-size="10.5" fill="#777">実測（direct 0.03 / matrix 0.02 / shift 0.03）</text>
<text x="24" y="1078" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">④ どこまで確かか</text>
<rect x="24" y="1092" width="52" height="17" rx="3" fill="#1e8449" opacity="0.16"/>
<text x="50" y="1104" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">強い</text>
<text x="88" y="1104" text-anchor="start" font-size="11" fill="#444">分割リンクの係数 2.591 — 8 点の当てはめに加え、15ms と 30ms を予測してから実測して当てた</text>
<rect x="24" y="1114" width="52" height="17" rx="3" fill="#1e8449" opacity="0.16"/>
<text x="50" y="1126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">強い</text>
<text x="88" y="1126" text-anchor="start" font-size="11" fill="#444">床が増えないこと — 3 本のファームで実測。差はすべて分解能以下</text>
<rect x="24" y="1136" width="52" height="17" rx="3" fill="#1e8449" opacity="0.16"/>
<text x="50" y="1148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">強い</text>
