<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1320" width="1240" height="1320" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="1320" fill="#ffffff"/>
<text x="24" y="36" text-anchor="start" font-size="19" font-weight="bold" fill="#111">左（セントラル）の消費電流 — 何が食っていて、どこを変えると効くか</text>
<text x="24" y="58" text-anchor="start" font-size="12" fill="#666">2026-08-10〜11 の実測。電池 ＋ テスター（mA 直列）。5 つとも実測。UART の宣言を外し、電池を入れ直してから読んだ値。</text>
<text x="24" y="74" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">① 内訳と、設定を変えたときの姿（5 つとも実測）</text>
