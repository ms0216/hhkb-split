<rect x="750" y="456" width="13" height="13" fill="#2b4a97"/>
<text x="768" y="467" text-anchor="start" font-size="10" fill="#555">ホストリンク（左 ↔ PC）</text>
<text x="24" y="467" text-anchor="start" font-size="10.5" font-weight="bold" fill="#111">● ＝ 実測値</text>
<text x="24" y="502" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">② 使っている式と、その根拠</text>
<rect x="24" y="514" width="1192" height="132" rx="8" fill="#f7f9fb" stroke="#d5dae0"/>
<text x="44" y="542" text-anchor="start" font-size="14" font-weight="bold" fill="#111">I  =  床 0.090  +  2.591 ÷ 分割間隔[ms]  +  2.725 ÷ ( ホスト間隔[ms] × (latency+1) )</text>
<text x="44" y="568" text-anchor="start" font-size="11" fill="#555">前提: 無線イベント 1 回あたりの費用は、相手が右手でもホストでも同じ。→ 2 つの係数が近い値（2.591 と 2.725）になったことが傍証。</text>
<text x="44" y="590" text-anchor="start" font-size="11" fill="#555">latency は「送るものが無いとき、何回まで聞き逃してよいか」。送るものがあれば次の機会に送るので、打鍵の遅延は増えない。</text>
<text x="44" y="612" text-anchor="start" font-size="11" fill="#1e8449">検算: 既定 0.617（実測 0.63）／ 候補 A 0.441（実測 0.43）。latency 0 の掃引から作った式が、latency 30 の実測を当てている。</text>
<text x="44" y="632" text-anchor="start" font-size="11" fill="#d35400">⚠️ 本番はこれに 74LVC595 の静止電流 0.02mA（データシート・右は 2 個）が乗る。</text>
<text x="24" y="678" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">③ どのレバーが、どれだけ効くか</text>
<text x="24" y="704" text-anchor="start" font-size="11" font-weight="bold" fill="#555">変えるもの</text>
<text x="400" y="704" text-anchor="start" font-size="11" font-weight="bold" fill="#555">電流の変化</text>
<text x="520" y="704" text-anchor="start" font-size="11" font-weight="bold" fill="#555">寿命の変化</text>
<text x="650" y="704" text-anchor="start" font-size="11" font-weight="bold" fill="#555">払う代償</text>
<text x="890" y="704" text-anchor="start" font-size="11" font-weight="bold" fill="#555">何で確かめたか</text>
<line x1="24" y1="710" x2="1216" y2="710" stroke="#ccd2d8"/>
<text x="24" y="732" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">ホストの latency を 0 → 30</text>
