<text x="400" y="882" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">0.000mA</text>
<text x="520" y="882" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">±0</text>
<text x="650" y="882" text-anchor="start" font-size="11" fill="#555">—</text>
<text x="890" y="882" text-anchor="start" font-size="10.5" fill="#777">計算（60 秒に 1 回の通知）</text>
<text x="24" y="938" text-anchor="start" font-size="14.5" font-weight="bold" fill="#111">④ どこまで確かか</text>
