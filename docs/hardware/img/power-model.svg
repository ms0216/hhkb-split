<text x="88" y="964" text-anchor="start" font-size="11" fill="#444">分割リンクの係数 2.591 — 7.5〜60ms を 8 点。残差 ≤0.034mA</text>
<rect x="24" y="974" width="52" height="17" rx="3" fill="#1e8449" opacity="0.16"/>
<text x="50" y="986" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">強い</text>
<text x="88" y="986" text-anchor="start" font-size="11" fill="#444">床が増えないこと — 3 本のファームで実測。差はすべて分解能以下</text>
<rect x="24" y="996" width="52" height="17" rx="3" fill="#1e8449" opacity="0.16"/>
<text x="50" y="1008" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">強い</text>
<text x="88" y="1008" text-anchor="start" font-size="11" fill="#444">候補 A の 0.43mA — Mac・Windows・電池入れ直しで一致。macOS はログで受理を確認</text>
<rect x="24" y="1018" width="52" height="17" rx="3" fill="#c0392b" opacity="0.16"/>
<text x="50" y="1030" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">弱い</text>
<text x="88" y="1030" text-anchor="start" font-size="11" fill="#444">ホストリンクの係数 2.725 — 3 点だが 45ms と 60ms が同値。実質 2 点・未知数 2 個で自由度 0</text>
<rect x="24" y="1040" width="52" height="17" rx="3" fill="#c0392b" opacity="0.16"/>
<text x="50" y="1052" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">弱い</text>
<text x="88" y="1052" text-anchor="start" font-size="11" fill="#444">45/60ms の点 — 電流が 2 値を行き来する中から低い側を目で選んだ。ログで裏を取っていない</text>
<rect x="24" y="1062" width="52" height="17" rx="3" fill="#8c959d" opacity="0.16"/>
<text x="50" y="1074" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c959d">未確認</text>
<text x="88" y="1074" text-anchor="start" font-size="11" fill="#444">Windows の実際の interval / latency — 更新イベントを出さないので読めない。電流が同じことだけが分かっている</text>
<rect x="24" y="1084" width="52" height="17" rx="3" fill="#8c959d" opacity="0.16"/>
<text x="50" y="1096" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8c959d">未確認</text>
<text x="88" y="1096" text-anchor="start" font-size="11" fill="#444">0.87 → 0.96mA の 0.09（ログ入りファーム）。電池電圧は 3.00V で変わらず。説明が無い</text>
