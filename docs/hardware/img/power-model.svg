<text x="650" y="732" text-anchor="start" font-size="11" fill="#555">なし</text>
<text x="890" y="732" text-anchor="start" font-size="10.5" fill="#777">実測（Mac・Windows とも 0.43）＋ログで受理を確認</text>
<text x="24" y="762" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">分割リンクを 7.5 → 15ms</text>
<text x="400" y="762" text-anchor="start" font-size="11.5" font-weight="bold" fill="#d35400">−0.173mA</text>
<text x="520" y="762" text-anchor="start" font-size="11.5" font-weight="bold" fill="#d35400">＋4.0 ヶ月</text>
<text x="650" y="762" text-anchor="start" font-size="11" fill="#555">右手だけ平均 +3.75ms。左右差</text>
<text x="890" y="762" text-anchor="start" font-size="10.5" fill="#777">8 点の当てはめ（実測）</text>
<text x="24" y="792" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">分割リンクを 7.5 → 30ms</text>
<text x="400" y="792" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">−0.259mA</text>
<text x="520" y="792" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">＋8.8 ヶ月</text>
<text x="650" y="792" text-anchor="start" font-size="11" fill="#555">右手だけ平均 +7.5ms。左右差</text>
<text x="890" y="792" text-anchor="start" font-size="10.5" fill="#777">同上</text>
<text x="24" y="822" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">ホストの間隔を 15 → 60ms（latency 30 のまま）</text>
<text x="400" y="822" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">−0.004mA</text>
<text x="520" y="822" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">＋0.1 ヶ月</text>
<text x="650" y="822" text-anchor="start" font-size="11" fill="#555">両手に +22ms</text>
<text x="890" y="822" text-anchor="start" font-size="10.5" fill="#777">式。分解能以下なので実測で確かめられない</text>
<text x="24" y="852" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">マトリクス走査・595 の駆動をやめる</text>
<text x="400" y="852" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">0.00mA</text>
<text x="520" y="852" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c959d">±0</text>
<text x="650" y="852" text-anchor="start" font-size="11" fill="#555">—</text>
<text x="890" y="852" text-anchor="start" font-size="10.5" fill="#777">実測（direct 0.03 / matrix 0.02 / shift 0.03）</text>
