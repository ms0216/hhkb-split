<text x="24" y="139.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">既定（ZMK のまま）</text>
<text x="24" y="156.0" text-anchor="start" font-size="10.5" fill="#777">分割 7.5ms ／ ホスト 15ms・latency 0</text>
<text x="840.9714285714288" y="138.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.617 mA</text>
<text x="840.9714285714288" y="155.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1e8449">4.4 ヶ月</text>
<circle cx="840.0" cy="111" r="5" fill="#111"/>
<text x="830.0" y="115" text-anchor="end" font-size="10.5" font-weight="bold" fill="#111">実測 0.63</text>
<text x="300" y="179" text-anchor="start" font-size="10" fill="#777">latency 30 を要求していたが Apple の規則違反で捨てられていた</text>
<rect x="300.0" y="198" width="25.7" height="46" fill="#9aa1a8" stroke="#ffffff" stroke-width="1"/>
<rect x="325.7" y="198" width="51.4" height="46" fill="#6c3483" stroke="#ffffff" stroke-width="1"/>
