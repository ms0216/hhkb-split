<text x="660" y="348" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">低い側は、15ms 以降ほぼ床に張りついている</text>
<text x="660" y="368" text-anchor="start" font-size="11.5" fill="#111">7.5ms 0.49 ／ 10ms 0.48 ／ 11.25ms 0.47 ／ 12.5ms 0.44 ／ 15ms 0.30 ／ 30ms 0.29 ／ 60ms 0.28  [mA]</text>
<text x="660" y="388" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1e8449">60ms の低い側 0.28mA は、当てはめた床とぴったり同じ。</text>
<text x="660" y="408" text-anchor="start" font-size="11.5" fill="#666">低い側では分割リンクをほとんど消費していない。何が切り替わっているかは未解明。</text>
<text x="660" y="426" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">⚠️ 低い側は出る条件が分かっていない（待てば出ることも、出ないこともある）。</text>
