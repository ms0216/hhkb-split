<text x="44" y="392" font-size="14" font-weight="bold" fill="#6b5410">ゴースト試験（このタスクで最も重要）</text>
<text x="44" y="414" font-size="12" fill="#6b5410">a ・ b ・ c の 3 つを同時に押し続ける。このとき d が出なければ合格。</text>
<text x="44" y="434" font-size="12" fill="#6b5410">ダイオードが抜け道を止めている証拠であり、Shift や Ctrl との同時押しが安全だと確認できる。</text>
