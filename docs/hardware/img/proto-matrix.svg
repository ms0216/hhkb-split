<text x="583" y="320" text-anchor="middle" font-size="11" fill="#4a63a0">ダイオードのカソード側</text>
<rect x="24" y="430" width="652" height="80" rx="6" fill="#fff8e6" stroke="#c9a227" stroke-width="1.5"/>
<text x="44" y="454" font-size="14" font-weight="bold" fill="#6b5410">ゴースト試験（このタスクで最も重要）</text>
<text x="44" y="476" font-size="12" fill="#6b5410">a ・ b ・ c の 3 つを同時に押し続ける。このとき d が出なければ合格。</text>
<text x="44" y="496" font-size="12" fill="#6b5410">ダイオードが抜け道を止めている証拠であり、Shift や Ctrl との同時押しが安全だと確認できる。</text>
