<text x="958.1658986175115" y="292" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">式から 0.45mA ／ 実測 0.43mA</text>
<rect x="560" y="312" width="11" height="11" fill="#8fa3bf"/>
<text x="576" y="322" text-anchor="start" font-size="10" fill="#444">CPU・DC/DC</text>
