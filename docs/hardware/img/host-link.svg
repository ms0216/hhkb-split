<text x="798" y="322" text-anchor="start" font-size="10" fill="#444">分割リンク 7.5ms</text>
<rect x="918" y="312" width="11" height="11" fill="#1e8449"/>
<text x="934" y="322" text-anchor="start" font-size="10" fill="#444">ホスト</text>
<text x="560" y="378" text-anchor="start" font-size="12" font-weight="bold" fill="#111">latency を効かせると、ホストリンクが 30 分の 1 になる。打鍵の遅延は 1ms も増えない。</text>
<text x="560" y="398" text-anchor="start" font-size="11" fill="#666">latency は「送るものが無ければ聞かなくてよい」仕組み。押せば次の接続イベントで送れる。</text>
<text x="24" y="470" text-anchor="start" font-size="13.5" font-weight="bold" fill="#111">③ なぜ今まで効いていなかったか — ZMK の既定が Apple の規則に違反していた</text>
<rect x="24" y="484" width="1132" height="132" rx="8" fill="#fef6ec" stroke="#d35400" stroke-width="1.5"/>
<text x="44" y="510" text-anchor="start" font-size="12" font-weight="bold" fill="#111">Apple Accessory Design Guidelines（2026-06-08 版）§58.6 より</text>
<text x="44" y="532" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">✕ Interval Min ≥ 15 ms・15 ms の倍数</text>
<text x="700" y="532" text-anchor="start" font-size="11.5" font-weight="bold" fill="#c0392b">ZMK の既定は 7.5 ms</text>
<text x="44" y="556" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">◯ Peripheral Latency ≤ 30</text>
<text x="700" y="556" text-anchor="start" font-size="11.5" fill="#444">30</text>
<text x="44" y="580" text-anchor="start" font-size="11.5" font-weight="bold" fill="#111">◯ Supervision Timeout ＞ Interval Max ×(Latency+1)×3</text>
<text x="700" y="580" text-anchor="start" font-size="11.5" fill="#444">6,000 ＞ 1,395</text>
<text x="44" y="606" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">→ 要求ごと捨てられ、macOS の初期値（15ms・latency 0）のまま動いていた。latency 30 は一度も効いていなかった。</text>
<text x="24" y="640" text-anchor="start" font-size="13.5" font-weight="bold" fill="#111">④ 何を払って何を得るか</text>
<text x="44" y="662" text-anchor="start" font-size="11" fill="#666">設定</text>
<text x="300" y="662" text-anchor="start" font-size="11" fill="#666">電流</text>
<text x="450" y="662" text-anchor="start" font-size="11" fill="#666">打鍵の遅延（左/右）</text>
<text x="700" y="662" text-anchor="start" font-size="11" fill="#666">寿命</text>
<text x="850" y="662" text-anchor="start" font-size="11" fill="#666">左右差</text>
<line x1="34" y1="670" x2="1150" y2="670" stroke="#d5dae0" stroke-width="1.5"/>
<text x="44" y="698" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">いま（ZMK の既定）</text>
<text x="300" y="698" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.63mA</text>
<text x="450" y="698" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">10.5 / 14.25ms</text>
<text x="700" y="698" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">4.4 ヶ月</text>
<text x="850" y="698" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">3.75ms</text>
<rect x="34" y="714" width="1116" height="36" rx="5" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>
<text x="44" y="738" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">候補 A（15ms・latency 30）</text>
<text x="300" y="738" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">0.43mA</text>
<text x="450" y="738" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">10.5 / 14.25ms</text>
<text x="700" y="738" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">6.3 ヶ月</text>
<text x="850" y="738" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111">3.75ms</text>
<text x="44" y="790" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1e8449">分割リンクには一切触っていない。遅延も左右差も変わらない。</text>
<text x="44" y="812" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">⚠️ 未解決: 60ms を要求したとき、電流が 0.50 ⇄ 0.65mA を行き来した。0.65 は macOS の初期値の電流と同じ。</text>
<text x="44" y="832" text-anchor="start" font-size="11.5" fill="#666">→ 接続パラメータが行き来している疑い。ログで確かめる。今日ずっと追ってきた「低い側」の謎と繋がるかもしれない。</text>
