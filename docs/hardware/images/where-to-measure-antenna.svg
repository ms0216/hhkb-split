<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 961 962" width="961" height="962"
     font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect width="961" height="962" fill="#fdfdfa"/>
  <text x="28" y="40" font-size="22" font-weight="bold" fill="#111">XIAO の青い部品（アンテナ）の位置を測ってほしい</text>
  <text x="28" y="70" font-size="16" fill="#333">① <tspan font-weight="bold">青い部品が見える面</tspan>を上にして、<tspan font-weight="bold">USB を奥（図の上）</tspan>に向ける</text>
  <text x="46" y="94" font-size="14" fill="#666">この向きだと、手前の左に「TX」、右に「RX」と印刷されています</text>
  <text x="28" y="122" font-size="16" fill="#333">② 下の <tspan font-weight="bold" fill="#c0392b">★ の矢印</tspan>（左の縁 → 青い部品の中心）を測る。定規は 1mm 刻みで十分</text>
  <text x="28" y="150" font-size="16" fill="#333">③ その値が <tspan font-weight="bold" fill="#c0392b">7.8mm</tspan> より小さいか大きいかを教えてください</text>

  <!-- USB コネクタ -->
  <rect x="249.0" y="192.8" width="193.6" height="57.2"
        rx="4" fill="#b9c4cc" stroke="#555" stroke-width="2"/>
  <text x="555.6" y="219.2" font-size="15" fill="#555">USB-C</text>

  <!-- 基板 -->
  <rect x="150.0" y="250.0" width="391.6" height="462.0"
        rx="10" fill="#2b2b2b" stroke="#111" stroke-width="2"/>
  <rect x="154.4" y="301.3" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="318.4" font-size="15" fill="#eee">D0</text><rect x="502.0" y="301.3" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="318.4" font-size="15" fill="#eee" text-anchor="end">5V</text><rect x="154.4" y="357.1" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="374.2" font-size="15" fill="#eee">D1</text><rect x="502.0" y="357.1" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="374.2" font-size="15" fill="#eee" text-anchor="end">GND</text><rect x="154.4" y="413.0" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="430.1" font-size="15" fill="#eee">D2</text><rect x="502.0" y="413.0" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="430.1" font-size="15" fill="#eee" text-anchor="end">3V3</text><rect x="154.4" y="468.9" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="486.0" font-size="15" fill="#eee">D3</text><rect x="502.0" y="468.9" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="486.0" font-size="15" fill="#eee" text-anchor="end">D10</text><rect x="154.4" y="524.8" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="541.9" font-size="15" fill="#eee">D4</text><rect x="502.0" y="524.8" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="541.9" font-size="15" fill="#eee" text-anchor="end">D9</text><rect x="154.4" y="580.7" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="597.8" font-size="15" fill="#eee">D5</text><rect x="502.0" y="580.7" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="597.8" font-size="15" fill="#eee" text-anchor="end">D8</text><rect x="154.4" y="636.5" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="198.4" y="653.6" font-size="15" fill="#eee">D6 (TX)</text><rect x="502.0" y="636.5" width="35.2" height="24.2" rx="3" fill="#d9a441" stroke="#8a6a20"/><text x="493.2" y="653.6" font-size="15" fill="#eee" text-anchor="end">D7 (RX)</text>

  <!-- アンテナ（推定位置）と不確かさ -->
  <rect x="247.9" y="654.8"
        width="121.0" height="35.2"
        fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="269.9" y="659.2"
        width="77.0" height="33.0"
        fill="#2b7fd4" stroke="#14508c" stroke-width="2"/>
  <text x="308.4" y="747.2" font-size="15" font-weight="bold"
        fill="#14508c" text-anchor="middle">青いセラミック（アンテナ）</text>
  <text x="308.4" y="769.2" font-size="13" fill="#888"
        text-anchor="middle">点線＝私の読みの誤差 ±1mm</text>

  <!-- 判定の線（左端から THRESH_FROM_EDGE） -->
  <line x1="320.5" y1="140.0"
        x2="320.5" y2="811.0"
        stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="334.5" y="830.8" font-size="16"
        font-weight="bold" fill="#c0392b">← この赤い線が 7.8mm の位置</text>

  <!-- 測る矢印 -->
  <line x1="150.0" y1="800.0" x2="308.4" y2="800.0"
        stroke="#111" stroke-width="2.5"/>
  <line x1="150.0" y1="791.2" x2="150.0" y2="808.8" stroke="#111" stroke-width="2.5"/>
  <line x1="308.4" y1="791.2" x2="308.4" y2="808.8" stroke="#111" stroke-width="2.5"/>
  <text x="229.2" y="826.4" font-size="17" font-weight="bold"
        fill="#111" text-anchor="middle">★ ここを測る</text>
  <text x="229.2" y="850.6" font-size="14" fill="#333"
        text-anchor="middle">左の縁から、青い部品の中心まで</text>

  <!-- 判定 -->
  <g transform="translate(582,294)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#111">読み方</text>
    <rect x="0" y="18" width="270" height="86" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="14" y="44" font-size="15" font-weight="bold" fill="#c0392b">7.8mm より近い</text>
    <text x="14" y="66" font-size="14" fill="#333">（青い部品の中心が赤い線より左）</text>
    <text x="14" y="90" font-size="14" fill="#333">→ 配線 1 本がアンテナの下</text>
    <rect x="0" y="118" width="270" height="86" rx="6" fill="#eaf6ee" stroke="#1a6b3c" stroke-width="2"/>
    <text x="14" y="144" font-size="15" font-weight="bold" fill="#1a6b3c">7.8mm より遠い</text>
    <text x="14" y="166" font-size="14" fill="#333">（青い部品の中心が赤い線より右）</text>
    <text x="14" y="190" font-size="14" fill="#333">→ 何もしなくてよい</text>
    <text x="0" y="238" font-size="13" fill="#555">※ 1mm 刻みの定規で十分です。</text>
    <text x="0" y="258" font-size="13" fill="#555">　赤い線より左か右か、だけで足ります。</text>
    <text x="0" y="286" font-size="13" fill="#555">※ 私の読みは 7.2mm（＝左）ですが、</text>
    <text x="0" y="306" font-size="13" fill="#555">　閾値まで 0.55mm しかありません。</text>
  </g>

  <text x="28" y="932" font-size="14" fill="#333">この 1 つで、子基板の配線をやり直す価値があるかが決まります（open-gaps #23）。</text>
</svg>
