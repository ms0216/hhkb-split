# 右にポッドを付けるときに足す設定（追加シールド hhkb_pod_right の .conf。
# Zephyr が <シールド名>.conf を自動で重ねる／cmake/modules/shields.cmake）。
#
# **I2C・PM_DEVICE・ZMK_POINTING は firmware/Kconfig の HHKB_STICK_POD が
# select で引く**（devicetree にポッドがあれば入る）。ここに書くのは
# 「書き忘れても動くが、読んだ人が探さずに済むように」の再掲。
CONFIG_I2C=y
CONFIG_ZMK_POINTING=y
# 既定は 500ms。SCL が Low に固定されたとき、読み出しごとに 0.5 秒止まる。
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=10
#
# ⚠️ 右で ZMK_POINTING が y になると、キーマップの <input/processors.dtsi> が持つ
#    入力プロセッサ（scaler / transform / code-mapper / behaviors）が**右でも初めて
#    コンパイルされる**。CI でリンクが落ちたら次の行を生かす（右では使っていない）:
# CONFIG_ZMK_INPUT_PROCESSOR_BEHAVIORS=n
