# Task C4: BLE 送信バーストの高さと長さを測るためだけの設定。
#
# **本番の設定ではない。**測定を汚す要素を 1 つずつ外してある。
# 経緯は c4_txburst.overlay の冒頭。

# ⚠️ **名前で治具を見分けられるようにしてある。**
#
# 2026-08-16 の 1 回目の測定で、**どのファームで測ったのか分からなくなった**
# （報告に「起動後 60 秒でスリープする firmware」とあったが、この治具は
# 30 分。60 秒なのは古い proto_split_left）。**LED とスキャンの有無が
# 変わるので、取り違えると測定の意味が変わる。**
#
# **BLE の広告名で確認できる。**測る前にスキャナで名前を見ること。
CONFIG_ZMK_KEYBOARD_NAME="c4txburst v2"

# --------------------------------------------------------------------------
# ⚠️ **LED を明示的に消す。この治具の存在理由。**
# --------------------------------------------------------------------------
# XIAO の RGB LED は**共通アノードで 3V3 に直結**（回路図 RGB1）。
# 3V3 パッドへ注入した電流が LED を通る経路を持つ。1 色 1〜2mA で、
# **測りたい TX バースト 15mA と同じ桁。**
#
# 未接続だと青と緑が 1 秒に 2 回点滅する条件に入るので、
# **この測定では必ず邪魔になる。**
#
# **HHKB_STATUS_LED=n にするだけでは足りない。**それは status_led.c を
# ビルドしないだけで、ピンを消灯側へ駆動しない。未初期化の GPIO は
# 入力ハイインピーダンスなので消えている「はず」だが、**それは推測**
# （CLAUDE.md 5「設定しただけでは効いていない。実際に消えたかまで見る」）。
#
# ⚠️ **これを焼いても、オシロでベースラインを読んで実際に消えたことを
# 確認すること。**Kconfig を信じるのではなく、測って確かめる。
CONFIG_HHKB_STATUS_LED=n
CONFIG_HHKB_LED_FORCE_OFF=y

# --------------------------------------------------------------------------
# 分割にしない
# --------------------------------------------------------------------------
# **分割セントラルにする。2026-08-16 に n → y へ直した。**
# --------------------------------------------------------------------------
# ⚠️ **最初 `n` にしていたのは誤りだった**（利用者の指摘）。
#
# 「相方が居ないと 3.7mA 食う（#26）ので、その電流が混ざると困る」と考えて
# 切ったが、**バルクの役割は「電流の最大瞬間風速に耐えること」**なので、
# **混ざった状態こそが測定対象**だった。
#
#   ホストへの広告（TX）と、右を探すスキャン（RX）は**同時に動く**。
#   重なった瞬間の電流は**足し算**になる。**そこが最大瞬間風速。**
#
# 「ピークの高さは送信理由によらない」と考えて切ったが、**それは推論で
# あって実測ではない。**TX は PA、スキャンは LNA と別の回路が動くので、
# 重なりを外した測定では、**測りたいものが抜ける。**
#
# **右は繋がない**（居ないほうがスキャンし続けるので、重なりが起きやすい）。
# ホストとも繋がない（広告し続ける）。**両方が動き続ける状態を作る。**
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# スリープさせない（**測定中に寝られると困る**）
# --------------------------------------------------------------------------
# #44 の 53 秒はスリープに入れて測ったものだが、今回は逆に邪魔。
# 30 分あれば測り終わる。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# 電池残量計を積まない（ADC の周期的な動作が段になって乗る）
# --------------------------------------------------------------------------
CONFIG_HHKB_BATTERY_ALKALINE=n
CONFIG_HHKB_LOW_BATTERY_SOFT_OFF=n
CONFIG_ZMK_BATTERY_REPORTING=n

# --------------------------------------------------------------------------
# ⚠️ ログは入れない。**+0.44mA 乗る**（2026-08-10 実測）
# --------------------------------------------------------------------------
# CONFIG_LOG=y は書かない。UART の宣言も overlay に置いていない
# （宣言があるだけで +0.46mA。2026-08-11 実測）。

# --------------------------------------------------------------------------
# 接続パラメータは**本番と同じ**にする（#31 の検証結果）
# --------------------------------------------------------------------------
# 15ms・latency 30 → 実効 465ms に 1 回の通信。
# **トリガ待ちは長くなるが、本番と同じ条件で測るほうが正しい。**
#
# ⚠️ 捕まえにくければ、**ペアリングせず広告のまま**測るとよい。
# 広告は規則的に出るので単発トリガで拾いやすい。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
