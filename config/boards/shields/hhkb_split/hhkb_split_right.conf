CONFIG_ZMK_KEYBOARD_NAME="HHKB Split"
CONFIG_ZMK_SPLIT=y

# シフトレジスタは SPI 経由で駆動するので必須。
CONFIG_SPI=y

# 深いスリープ。理由と検証は左側の .conf に書いた。
# 周辺側も同じ時間で寝かせないと、片方だけ電池が減る。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# デバウンス。ZMK の既定は押し 5ms / 離し 5ms。
# **Type-S に寄せるなら押しは短い方がよいが、短すぎるとチャタリングを拾う。**
# 押し 3ms / 離し 5ms から始め、Task C2-b の実測で詰める。
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# 電池まわり。理由と出所は左側の .conf に書いた。
# **右も同じにする。**片方だけ乾電池の曲線にすると、左右で違う% が出る。
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_PM_SOFT_OFF=y
