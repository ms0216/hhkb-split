CONFIG_ZMK_KEYBOARD_NAME="HHKB Split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# シフトレジスタは SPI 経由で駆動するので必須。
CONFIG_SPI=y

# --------------------------------------------------------------------------
# 深いスリープ
#
# **既定は無効。乾電池駆動では入れないと寿命が桁で変わる。**
#
# シフトレジスタと併用して大丈夫かを ZMK の実装で確かめた:
#   - kscan_gpio_matrix.c は割り込みを有効にするとき全列を HIGH にする
#     （USE_INTERRUPTS はポーリング無効時に真。既定でポーリングは無効）
#   - 595（SN74LVC595A）はラッチなので、SPI が止まっても列は HIGH のまま保たれる
#   - ZMK の pm.c は pm_device_wakeup_is_enabled のデバイスをサスペンド対象
#     から除外する。kscan は wakeup-source なので入力は切られない
#   → 押鍵で起きる経路が成立する
#
# 15 分（既定）ではなく 30 分にした。深いスリープからの復帰では BLE の
# 再接続に 1〜2 秒かかり、起こした 1 打鍵目が失われる。席を外すたびに
# 起きると使用感を損なうので、日中は起こしにくく、夜間や週末は確実に
# 寝る値を選んだ。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 右半分の電池残量を左が受け取り、ホストへ中継する。
# 電池が左右 2 本ずつ独立しているので、どちらが減ったか分からないと困る。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# デバウンス。ZMK の既定は押し 5ms / 離し 5ms。
# **Type-S に寄せるなら押しは短い方がよいが、短すぎるとチャタリングを拾う。**
# 押し 3ms / 離し 5ms から始め、Task C2-b の実測で詰める。
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --------------------------------------------------------------------------
# 電池（乾電池向けの残量計と、打ち止めでの安全な停止）
#
# 残量%: ZMK 標準はリチウムイオンの放電曲線なので、乾電池 2 本では
# ほぼ常に 0% になる。dtsi の vbatt を hhkb,battery-alkaline にして、
# 使える電圧の窓での残りを % にしている（open-gaps #13）。
# **driver が出した % をそのまま使うモードにする。**
#
# 打ち止め: レールが落ちてブラウンアウトを繰り返すと、電池を無駄に
# 使ううえ、低電圧の flash 書き込みでペアリング情報が壊れうる。
# 自分から soft off に入る（open-gaps #25b）。
# --------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_PM_SOFT_OFF=y
