CONFIG_ZMK_KEYBOARD_NAME="proto charlie"

# 検証中は USB のみにする。BLE のペアリング状態を変数から外すため。
# 本番シールドはこの設定を持たない（無線が主）。
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y

# ブレッドボードはジャンパ線が長く、配線容量で信号の立ち上がりが鈍る。
# 既定は 0 で、実装済み基板なら足りるが、治具では取りこぼす恐れがある。
# 単位はマイクロ秒（driver が k_busy_wait に渡している）。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=20
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BETWEEN_OUTPUTS=20
