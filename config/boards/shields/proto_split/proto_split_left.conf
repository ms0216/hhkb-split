CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# **スリープ。本番と同じ `y` にする。**
#
# 2026-08-09 に足した。**これが無いまま Task C4 の測定 B をやって、
# 2.0〜2.5mA から一向に下がらなかった。**ZMK の既定は `n` なので、
# 治具は何時間放置しても deep sleep に入らない。測っていたのは
# 「起きたままの電流」で、**測りたかった値ではなかった。**
#
# **待ち時間は本番と同じ 30 分に戻した（2026-08-09）。**
#
# 一度 1 分にしてスリープ電流（2〜3µA）を測った。次に測りたいのは
# **起きているときの定常値**で、こちらが電池寿命を支配する（3 桁差）。
#
# ZMK は `CONFIG_ZMK_IDLE_TIMEOUT`（既定 30 秒）を過ぎると idle 状態へ
# 移り、BLE の接続間隔を伸ばして消費を下げる。**1 分で寝てしまうと、
# 起動直後の高い値しか測れない。**測定 C の 2.2mA はそれを掴んだ疑いがある。
#
# 30 分あれば、接続したまま数分放置して定常値を読める。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 測定用。済んだら消す**（2026-08-09）
#
# 測るのは 2 つ（Task C3 の §5-6 の「まだ測っていないこと」）。
#
#   ① ホストが許可した接続間隔と latency
#      → ZMK の le_param_updated（ble.c）が出す。左はペリフェラル役なので
#        希望を出すだけで、決めるのはホスト。**要素 4 が要るかが決まる。**
#
#   ② 分割リンクの PHY  → **設定から結論が出たので測らない**（下記）
#
# **BT_CONN を DBG にしてはいけない（2026-08-09 に実際に壊した）。**
# 分割リンクは 7.5ms ごと＝133 回/秒で、bt_conn_tx_processor が毎回ログを
# 吐く。CDC の 1024 バイトのリングバッファが溢れ、**1.48 秒でログが止まり、
# ホストとの BLE 接続まで巻き添えで確立しなくなった。**
# 測定器が測定対象を壊す形。今日 3 回目（シャントの接触抵抗・電流計の
# 負担電圧に続いて）。
#
# **PHY は設定から決まる。**Zephyr の既定は
#   BT_CTLR_PHY = y / BT_CTLR_PHY_2M = y（nRF52840 は 2M 対応）
#   BT_AUTO_PHY_CENTRAL = 2M（セントラルが接続直後に 2M を要求する）
# ZMK は上書きしていない（`default n if ZMK_BLE_EXPERIMENTAL_CONN` は
# この案件では効かない）。**したがって定常状態は 2M。**
# ログの `PHY: 1` は、ZMK が接続時にしか PHY をログしないため
# （split_central_process_connection は split_central_connected からのみ
# 呼ばれる）。PHY 更新はその直後に走る。
#
# **消し忘れると電流の測定が狂う**（USB が有効になり、ログ出力の負荷も乗る）。
# --------------------------------------------------------------------------
CONFIG_ZMK_USB_LOGGING=y
