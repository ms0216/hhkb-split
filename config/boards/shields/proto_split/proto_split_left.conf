CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# **スリープ。本番と同じ `y` にする。**
#
# 2026-08-09 に足した。**これが無いまま Task C4 の測定 B をやって、
# 2.0〜2.5mA から一向に下がらなかった。**ZMK の既定は `n` なので、
# 治具は何時間放置しても deep sleep に入らない。測っていたのは
# 「起きたままの電流」で、**測りたかった値ではなかった。**
#
# **待ち時間は本番と同じ 30 分に戻した（2026-08-09）。**
#
# 一度 1 分にしてスリープ電流（2〜3µA）を測った。次に測りたいのは
# **起きているときの定常値**で、こちらが電池寿命を支配する（3 桁差）。
#
# **⚠️ 次の 1 段落は確かめていない。**「idle で接続間隔が伸びる」は
# 私が書いたもので、測っていない（2026-08-09 に自覚）。
# → task-c3-ble-split.md の「残っている調査」の A
#
# ZMK は `CONFIG_ZMK_IDLE_TIMEOUT`（既定 30 秒）を過ぎると idle 状態へ
# 移り、BLE の接続間隔を伸ばして消費を下げる。**1 分で寝てしまうと、
# 起動直後の高い値しか測れない。**測定 C の 2.2mA はそれを掴んだ疑いがある。
#
# 30 分あれば、接続したまま数分放置して定常値を読める。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 床の内訳を割るため。済んだら消す**（2026-08-10）
#
# **ホストとの BLE（HID）を切る。**広告もホストリンクも消えるので、
# 残るのが「本当の底」。分割リンクは別の設定なので生きたまま。
#
#   底     = この構成の実測 − 分割リンク（2.59 ÷ 間隔）
#   広告   = （Mac の Bluetooth オフのとき）− この構成
#   ホスト = （接続しているとき）− この構成
#
# **⚠️ c・d で確認できなくなる。**繋がっているかは電流で見る
# （3.7mA ならスキャン中＝繋がっていない）。
# --------------------------------------------------------------------------
CONFIG_ZMK_BLE=n

# --------------------------------------------------------------------------
# ⚠️ **[一時的] ホストリンクの内訳を割るため**（2026-08-10 に用意）
#
# ホスト（Mac）との接続間隔を 45ms に固定する。
# **Apple の規則で 15ms 以上・15ms の倍数**（Accessory Design Guidelines §49.6）。
# ZMK の既定は 6〜12（7.5〜15ms）で、その範囲では 15ms しか採れなかった。
# --------------------------------------------------------------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=36
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=36
