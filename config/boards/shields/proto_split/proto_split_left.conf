CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# **スリープ。本番と同じ `y` にする。**
#
# 2026-08-09 に足した。**これが無いまま Task C4 の測定 B をやって、
# 2.0〜2.5mA から一向に下がらなかった。**ZMK の既定は `n` なので、
# 治具は何時間放置しても deep sleep に入らない。測っていたのは
# 「起きたままの電流」で、**測りたかった値ではなかった。**
#
# **待ち時間は本番と同じ 30 分に戻した（2026-08-09）。**
#
# 一度 1 分にしてスリープ電流（2〜3µA）を測った。次に測りたいのは
# **起きているときの定常値**で、こちらが電池寿命を支配する（3 桁差）。
#
# **⚠️ 次の 1 段落は確かめていない。**「idle で接続間隔が伸びる」は
# 私が書いたもので、測っていない（2026-08-09 に自覚）。
# → task-c3-ble-split.md の「残っている調査」の A
#
# ZMK は `CONFIG_ZMK_IDLE_TIMEOUT`（既定 30 秒）を過ぎると idle 状態へ
# 移り、BLE の接続間隔を伸ばして消費を下げる。**1 分で寝てしまうと、
# 起動直後の高い値しか測れない。**測定 C の 2.2mA はそれを掴んだ疑いがある。
#
# 30 分あれば、接続したまま数分放置して定常値を読める。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000


# --------------------------------------------------------------------------
# ⚠️ **[一時的] 候補 A の検証**（2026-08-10）
#
# **ホストとの接続を「15ms・latency 30」にする。遅延を 1ms も払わずに済む。**
#
# Apple Accessory Design Guidelines（2026-06-08 版）§58.6 に完全に適合する:
#   Peripheral Latency ≤ 30                       → 30      ✅
#   Supervision Timeout 6〜18 秒                   → 6 秒    ✅
#   Interval Min ≥ 15ms・15ms の倍数               → 15ms    ✅
#   Interval Max ≥ Min+15ms **または両方 15ms**    → 両方 15ms ✅（例外規定）
#   Interval Max ×(Latency+1) ≤ 6 秒              → 0.465 秒 ✅
#   Timeout ＞ Interval Max ×(Latency+1)×3        → 6000 ＞ 1395 ✅
#
# **ZMK の既定（min 7.5ms）は「Interval Min ≥ 15ms」に違反していて、
# 要求ごと捨てられていた。**だから latency 30 も一度も効いていなかった。
# --------------------------------------------------------------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 図の 3 段目を実測する**（2026-08-11）
#
# power-model.svg の「候補 A ＋ 分割 15ms」は式からの予測（0.269mA）で、
# **実測がまだ無い。**採用の可能性が高い選択肢なので測る。
#   6 = 7.5ms（既定）  12 = 15ms   24 = 30ms
# --------------------------------------------------------------------------
# ⚠️ [一時的] 切り分け: 分割 15ms のまま、候補 A（latency 30）だけ外す。
# D1 で同じ条件（latency 0）が 0.30〜0.47mA だったので、そこへ戻るかを見る。
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24

# ⚠️ **[一時的] ログ。電流を測るときは必ず外す**（2026-08-10）
#
# **ログを入れると +0.44mA 乗る。**素の値と混ぜないこと。
# 2026-08-11 に、これを入れたまま分割 15ms を焼いてしまった
# （571,392 B ＝ ログ有りの大きさ。ログ無しは 470,528 B）。
#
# 接続パラメータを読みたいときだけ戻す。
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_LOG_BACKEND_UART=y
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
