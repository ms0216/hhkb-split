CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# **スリープ。本番と同じ `y` にする。**
#
# 2026-08-09 に足した。**これが無いまま Task C4 の測定 B をやって、
# 2.0〜2.5mA から一向に下がらなかった。**ZMK の既定は `n` なので、
# 治具は何時間放置しても deep sleep に入らない。測っていたのは
# 「起きたままの電流」で、**測りたかった値ではなかった。**
#
# **待ち時間は本番と同じ 30 分に戻した（2026-08-09）。**
#
# 一度 1 分にしてスリープ電流（2〜3µA）を測った。次に測りたいのは
# **起きているときの定常値**で、こちらが電池寿命を支配する（3 桁差）。
#
# ZMK は `CONFIG_ZMK_IDLE_TIMEOUT`（既定 30 秒）を過ぎると idle 状態へ
# 移り、BLE の接続間隔を伸ばして消費を下げる。**1 分で寝てしまうと、
# 起動直後の高い値しか測れない。**測定 C の 2.2mA はそれを掴んだ疑いがある。
#
# 30 分あれば、接続したまま数分放置して定常値を読める。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 測定用。済んだら消す**（2026-08-09）
#
# **ログを USB ではなく UART へ出す。**TX は D6（P1.11）。治具でも本番でも
# 未使用のピン。**Saleae の Async Serial で読む。**
#
# **USB ログでは測れないものが 2 つあった。**
#   ① ホストが BLE だけで使っているときの接続パラメータ
#      USB を挿すと ZMK は HID を USB へ流すので、macOS の扱いが変わりうる
#   ② ログを取りながらの消費電流
#      USB 給電だと電池側に電流が流れないので、**原理的に同時に測れない**
#
# **UART なら電池のまま動くので、両方できる。**
#
# 「J-Link が要る」と一度書いたが誤り。手元にある道具（Saleae Logic 8）を
# 数えずに、無い道具を前提に「できない」と言っていた。
#
# **速度を 1Mbps へ上げてある**（proto_split_left.overlay）。
# 115200 では ZMK のログ量（毎秒 100 行級）に足りず、今日 USB で起きたのと
# 同じ「溢れて止まる」が起きる。
# --------------------------------------------------------------------------
# **`CONFIG_ZMK_LOG_LEVEL_DBG` が要る。**読みたい `le_param_updated` は
# ZMK の `LOG_DBG` で、既定の INFO ではコンパイル時に消える。
# `CONFIG_ZMK_USB_LOGGING` はこれを暗黙に上げていたので、USB のときは
# 出ていた。UART へ移したときに落としていた（2026-08-09）。
#
# **装置を壊した `CONFIG_BT_CONN_LOG_LEVEL_DBG` とは別物。**あちらは
# Zephyr の BT スタック（133 回/秒）、こちらは ZMK のモジュールだけ。
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
