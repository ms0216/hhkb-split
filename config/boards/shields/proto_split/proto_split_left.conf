CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --------------------------------------------------------------------------
# **スリープ。本番と同じ `y` にする。**
#
# 2026-08-09 に足した。**これが無いまま Task C4 の測定 B をやって、
# 2.0〜2.5mA から一向に下がらなかった。**ZMK の既定は `n` なので、
# 治具は何時間放置しても deep sleep に入らない。測っていたのは
# 「起きたままの電流」で、**測りたかった値ではなかった。**
#
# **待ち時間は本番と同じ 30 分に戻した（2026-08-09）。**
#
# 一度 1 分にしてスリープ電流（2〜3µA）を測った。次に測りたいのは
# **起きているときの定常値**で、こちらが電池寿命を支配する（3 桁差）。
#
# **⚠️ 次の 1 段落は確かめていない。**「idle で接続間隔が伸びる」は
# 私が書いたもので、測っていない（2026-08-09 に自覚）。
# → task-c3-ble-split.md の「残っている調査」の A
#
# ZMK は `CONFIG_ZMK_IDLE_TIMEOUT`（既定 30 秒）を過ぎると idle 状態へ
# 移り、BLE の接続間隔を伸ばして消費を下げる。**1 分で寝てしまうと、
# 起動直後の高い値しか測れない。**測定 C の 2.2mA はそれを掴んだ疑いがある。
#
# 30 分あれば、接続したまま数分放置して定常値を読める。
# --------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] D1 の測定用。済んだら消す**（2026-08-10）
#
# 分割リンクの接続間隔。**ZMK の既定は 6（7.5ms）＝規格の下限。**
# 7.5 / 15 / 30ms で左の電流がどう変わるかを測る（要素 1 の交換レート）。
#   6 = 7.5ms（既定）  12 = 15ms   24 = 30ms
# --------------------------------------------------------------------------
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12


# --------------------------------------------------------------------------
# ⚠️ **[一時的] 段 2 の測定用。済んだら消す**（2026-08-10）
#
# **低い側（電流が落ちる状態）の正体をログで追う。**電流計では「いつ落ちるか」
# が掴めなかったので、落ちる瞬間に何が起きているかを見る。
#
# **ログの出口は `zephyr,console`（overlay で uart0 へ向けてある）。**
# `CONFIG_LOG_BACKEND_UART=y` だけでは USB CDC へ出る（2026-08-09 に実測）。
# --------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ⚠️ **[一時的] 段 2 の測定用。済んだら消す**（2026-08-10）
#
# **左も 60 秒ごとに自分の電池残量を Mac へ報告している。**右を 10 秒に
# しても電流の行き来が 60 秒周期のままだったので、**出どころは左**。
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=10
