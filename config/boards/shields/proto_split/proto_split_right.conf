CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y

# 左と同じ理由（proto_split_left.conf を見る）。本番 hhkb_split_right と
# 揃えて `y`。待ち時間も本番と同じ 30 分。
CONFIG_ZMK_SLEEP=y
# ⚠️ **[一時的] 寝起きの試験のため 1 分にする**（2026-08-11）。本番は 1800000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000


# --------------------------------------------------------------------------
# 左と同じ。ただし**右（周辺機）が出せる状態は左と違う。**
#   緑 1 秒に 2 回 … **左（セントラル）と繋がっていない**
#   橙            … 電池
#   消灯          … 繋がっている
#
# 右にホストとの接続は無いので、青の点滅は出ない（起動時の青点灯のみ）。
# 判定は zmk_split_peripheral_status_changed から取る。**この事象を
# 出しているのは peripheral.c、つまり右側**（左では飛ばない）。
# --------------------------------------------------------------------------
CONFIG_HHKB_STATUS_LED=y
