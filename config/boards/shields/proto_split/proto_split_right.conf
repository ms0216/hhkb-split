CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y

# 左と同じ理由（proto_split_left.conf を見る）。本番 hhkb_split_right と
# 揃えて `y`。待ち時間も本番と同じ 30 分。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 切り分け用。済んだら消す**（2026-08-09 に足した）
#
# **右を先に入れて 10 秒経つと左右がつながらなくなる**（open-gaps #27）。
# ZMK 側に 10 秒のタイマーは無いことを peripheral.c で確認済みなので、
# **これ以上は当てずっぽうにしかならない。**ログを直接読む。
#
# ZMK_LOG_LEVEL の既定は 4（DEBUG）なので、これだけで
#   左: [DEVICE]: ... / Found the split service /
#       Unable to reserve peripheral slot / Create conn failed
#   右: 広告の開始と打ち切り
# が出る。
#
# **左のログが要る理由。**「左が右をまったく見ていない」のか
# 「見ているが繋がらない」のかは、まったく別の話。右のログだけでは分からない。
#
# **消し忘れると電流の測定が狂う**（USB が有効になり、ログ出力の負荷も乗る）。
# 電流を測り直すときは必ず外すこと。
# --------------------------------------------------------------------------
CONFIG_ZMK_USB_LOGGING=y
