CONFIG_ZMK_KEYBOARD_NAME="proto split"
CONFIG_ZMK_SPLIT=y

# 左と同じ理由（proto_split_left.conf を見る）。本番 hhkb_split_right と
# 揃えて `y`。待ち時間も本番と同じ 30 分。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --------------------------------------------------------------------------
# ⚠️ **[一時的] 段 2 の測定用。済んだら消す**（2026-08-10）
#
# **電池報告の周期を 60 → 10 秒に縮める。**
#
# 左の電流が、触っていないのに 2 つの値を行き来する。落ちるのが起動から
# 60〜80 秒で、**ZMK の電池報告の既定 60 秒と一致する。**
#
# **無くして消えるかではなく、短くして速く起きるかを見る**（利用者の指摘）。
# 前者は他の原因で隠れただけの可能性が残るが、後者は用量反応なので
# 偶然では説明できない。
# --------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
